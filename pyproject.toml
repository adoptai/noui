[tool.poetry]
name = "noui"
version = "2.0.0"
description = "NoUI — dev repo for the agent-agnostic skill bundle (skills/noui) that captures, compiles, and activates browser workflows/logins via Tabby."
authors = ["Adopt AI <contact@adopt.ai>"]
readme = "README.md"
license = "MIT"
package-mode = false

# Runtime deps for the noui_core toolkit + generated MCP/Skill assets. The
# distributable bundle declares the same set in skills/noui/pyproject.toml.
# No FastAPI/SQLAlchemy/Anthropic — there is no backend daemon and the
# compile pipeline makes no LLM calls.
[tool.poetry.dependencies]
python = ">=3.11,<4.0"
python-dotenv = ">=1.0.0"
mcp = ">=1.0.0"
httpx = ">=0.27.0"

[tool.poetry.group.lint]
optional = true

[tool.poetry.group.lint.dependencies]
ruff = ">=0.4.0"
mypy = ">=1.10.0"

[tool.poetry.group.dev]
optional = true

[tool.poetry.group.dev.dependencies]
ruff = ">=0.4.0"
mypy = ">=1.10.0"
pre-commit = ">=3.7.0"

[tool.poetry.group.test]
optional = true

[tool.poetry.group.test.dependencies]
pytest = ">=9.0"
pytest-cov = ">=7.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["tabby"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "C4", "SIM", "UP"]
ignore = [
    "E501",    # line too long — handled by formatter
    "SIM102",  # nested if → single if (style preference)
    "SIM105",  # contextlib.suppress — verbose for CLI scripts
    "SIM108",  # ternary operator — readability preference
    "N806",    # uppercase variable in function — used for constants
    "B905",    # zip() strict= — Python 3.10+ only at call sites we don't control
    "B008",    # FastAPI requires Depends() in function argument defaults
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]  # sys.path manipulation before imports is intentional
# Scripts import _bootstrap first to put the bundle root on sys.path before
# importing noui_core; that ordering is intentional, so silence import-sort/E402.
"skills/noui/scripts/*" = ["E402", "I001"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------------------------------------------------------------------
# Mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
# Type-check the core toolkit (skills/noui/noui_core); skip generated assets,
# demo skills, the workbench, examples, and the Tabby submodule.
mypy_path = "skills/noui"
exclude = [
    "skills/noui/workbench/",
    "skills/travel/",
    "skills/quickbooks/",
    "mcp/",
    "tabby/",
]
warn_unused_configs = true
ignore_missing_imports = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = false
warn_return_any = false
no_implicit_reexport = true
strict_equality = true
show_error_codes = true

# Tests and fixtures — no strict typing required.
[[tool.mypy.overrides]]
module = [
    "tests.*",
]
disallow_untyped_defs = false
disallow_incomplete_defs = false
ignore_errors = true

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
# The distributable bundle lives at skills/noui/; put it on the path so tests
# (and scripts) can `import noui_core`.
pythonpath = ["skills/noui"]
